					<li>
						<button id="clearAll">
							<svg
								class="icon"
								xmlns="http://www.w3.org/2000/svg"

			<hr />
		</header>

		<main class="container grid">
			<article class="tasksContainer">
				<details class="tasksDetail" open>
					<summary class="secondary" role="button">Things to be done</summary>
					<ul id="tasksList" class="taskList"></ul>
				</details>
			</article>

			<article class="tasksContainer">
				<details class="tasksDetail">
					<summary class="secondary" role="button">
						Things you have done
					</summary>
					<ul id="completedList" class="taskList"></ul>
				</details>
			</article>
		</main>

		<footer class="formBottomContainer container">
			<form id="newTaskForm" action="">
				<fieldset role="group">
					<input id="newTaskTitle" type="text" placeholder="New Task" />
					<button type="submit">Create</button>
				</fieldset>
			</form>
		</footer>

		<script type="module" src="/src/main.ts" defer></script>
